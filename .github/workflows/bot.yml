name: Mayna Greeting Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: mayna-greeting-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile bot.py matcher.py delivery.py product_search.py policies.py

      - name: Run tests (no Telegram or Gemini access needed)
        continue-on-error: true  # a failing test is shown in red but never keeps the bot from starting
        run: python -m unittest discover -s tests -t .

      - name: Start Mayna bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRODUCT_DEBUG: "1"  # shows the failure reason in the reply; delete this line once everything works
        run: python bot.py
